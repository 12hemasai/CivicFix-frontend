openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Civic problem image analysis
  - name: authority
    description: Web intelligence for likely civic authorities
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze-problem:
    post:
      operationId: analyzeProblem
      tags: [analysis]
      summary: Analyze a civic problem image
      description: Analyzes a civic-problem image without storing the uploaded image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeProblemInput"
      responses:
        "200":
          description: Structured visual analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeProblemResult"
        "400":
          description: Invalid image input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Analysis service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /find-authority:
    post:
      operationId: findAuthority
      tags: [authority]
      summary: Find a likely civic reporting authority
      description: Searches public web results for official authority and complaint-channel evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindAuthorityInput"
      responses:
        "200":
          description: Authority search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindAuthorityResult"
        "400":
          description: Invalid authority search input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authority search is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeProblemInput:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        imageBase64:
          type: string
          minLength: 1
          maxLength: 15000000
      required:
        - mimeType
        - imageBase64
    AnalyzeProblemResult:
      type: object
      properties:
        issue_type:
          type: string
          enum:
            - pothole
            - damaged road
            - broken streetlight
            - garbage accumulation
            - overflowing garbage bin
            - blocked drain
            - damaged sidewalk
            - fallen/obstructing object
            - other visible civic infrastructure problem
            - uncertain
        severity:
          type: string
          enum: [low, medium, high]
        description:
          type: string
        potential_hazard:
          type: string
        visual_confidence:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - issue_type
        - severity
        - description
        - potential_hazard
        - visual_confidence
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    FindAuthorityInput:
      type: object
      properties:
        issue_type:
          type: string
          minLength: 1
          maxLength: 120
        location:
          type: string
          minLength: 1
          maxLength: 240
      required:
        - issue_type
        - location
    SupportingSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
      required:
        - title
        - url
        - snippet
    FindAuthorityResult:
      type: object
      properties:
        likely_authority:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        explanation:
          type: string
        official_reporting_url:
          type: string
        contact_information:
          type: string
        supporting_sources:
          type: array
          items:
            $ref: "#/components/schemas/SupportingSource"
      required:
        - likely_authority
        - confidence
        - explanation
        - official_reporting_url
        - contact_information
        - supporting_sources

